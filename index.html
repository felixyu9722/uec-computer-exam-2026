<!DOCTYPE html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年度马来西亚华文独中统一考试 - 电脑与资讯工艺 (SY18) 教师参考答案与考点全解</title>
  <meta name="description" content="2026年马来西亚华文独中统考高中电脑与资讯工艺（SY18）试卷一（选择题40题）与试卷二（作答题6大题）官方教师参考标准答案、阅卷采分标准、考点深度解析与互动演练系统。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部沉浸式 Hero 区域 -->
  <header class="hero-header">
    <div class="header-container">
      <div class="meta-tags-row">
        <span class="tag-pill tag-red">【机密】教师教研专属参考</span>
        <span class="tag-pill tag-blue">科目代号：SY18</span>
        <span class="tag-pill tag-emerald">2026年度独中统考</span>
        <span class="tag-pill tag-amber">董总高频题型考点对标</span>
      </div>

      <h1 class="main-title">2026 高中统考《电脑与资讯工艺》教师参考答案与全真考点解析</h1>
      <p class="sub-title">马来西亚华文独中统一考试 · 试卷一（选择题 40%）与 试卷二（作答题 60%）命题思路、采分标准及教学点拨</p>

      <div class="exam-info-grid">
        <div class="info-chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          考试日期：2026年10月28日
        </div>
        <div class="info-chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          卷一：2:00PM-3:00PM (1小时)
        </div>
        <div class="info-chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          卷二：3:15PM-4:45PM (1.5小时)
        </div>
        <div class="info-chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          计分权重：卷一 40% + 卷二 60%
        </div>
      </div>
    </div>
  </header>

  <!-- 黏性顶置控制台与工具列 -->
  <nav class="toolbar-sticky" aria-label="页面导览工具栏">
    <div class="toolbar-inner">
      <!-- 试卷切换标签 -->
      <div class="paper-nav-tabs">
        <button id="tabPaper1" class="nav-tab-btn active">
          试卷一 · 选择题
          <span class="tab-badge">40题</span>
        </button>
        <button id="tabPaper2" class="nav-tab-btn">
          试卷二 · 作答题
          <span class="tab-badge">6大题</span>
        </button>
      </div>

      <!-- 模式与工具操作 -->
      <div class="view-actions">
        <div class="mode-toggle-group">
          <button id="modeTeacher" class="mode-btn active" title="显示答案、考点归属与详细干扰项排除">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
            教师全解
          </button>
          <button id="modePractice" class="mode-btn" title="点击选项即时自测答题与计分">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
            自测练习
          </button>
          <button id="modeClean" class="mode-btn" title="隐藏所有答案与解析，还原纯净考卷排版">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
            卷面纯享
          </button>
        </div>

        <button class="btn-tool" onclick="window.print()" title="列印或汇出成完整 PDF 解析讲义">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          列印 / 导出PDF
        </button>
      </div>
    </div>
  </nav>

  <!-- 网页主体双列布局 -->
  <main class="main-wrapper">
    <!-- 左侧主要试题展示区 -->
    <div class="content-area">
      <!-- 试卷一容器 -->
      <section id="mcqContainer" aria-label="试卷一选择题列表"></section>

      <!-- 试卷二容器 -->
      <section id="subjContainer" aria-label="试卷二作答题列表" style="display:none;"></section>
    </div>

    <!-- 右侧黏性题号定位抽屉 -->
    <aside class="sidebar-sticky" aria-label="快速题号导航">
      <div class="sidebar-title">
        <span>快速题号索引</span>
        <span id="sidebarStats" class="sidebar-stats">40 题全卷</span>
      </div>

      <div class="filter-input-wrap">
        <svg class="filter-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="filterInput" class="filter-input" placeholder="输入关键词、考点搜索...">
      </div>

      <div id="questionGridNav" class="question-grid-nav"></div>

      <div class="legend-row">
        <div class="legend-item"><span class="legend-dot" style="background:#22c55e;"></span> 正确 / 满分</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span> 易错 / 扣分点</div>
        <div class="legend-item"><span class="legend-dot" style="background:#2563eb;"></span> 教师解析</div>
      </div>
    </aside>
  </main>

  <!-- 浮动操作按钮 -->
  <div class="floating-actions">
    <button class="fab-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="返回顶部">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>
  </div>

  <!-- 载入数据与脚本 -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
